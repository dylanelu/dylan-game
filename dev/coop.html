<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Co-op test</title>
  <style>
    html, body { margin: 0; height: 100%; background: #07060c; }
    body { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
    iframe { width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <!-- two players in one page, same room. /dev/coop.html?room=CODE
       Both land in the room's lobby (the first in hosts). Add &mode=pve or &mode=br to have the host start
       on its own as soon as the second player is in; without it, press START in the left one. -->
  <iframe id="a"></iframe>
  <iframe id="b"></iframe>
  <script>
    const q = new URLSearchParams(location.search);
    const room = q.get('room') || 'T' + Math.random().toString(36).slice(2, 6).toUpperCase();
    const auto = /^(pve|br)$/.test(q.get('mode') || '') ? `&auto=${q.get('mode')}` : '';
    document.getElementById('a').src = `/#room=${room}${auto}`;
    setTimeout(() => { document.getElementById('b').src = `/#room=${room}${auto}`; }, 1500);
  </script>
</body>
</html>
