<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Co-op test</title>
  <style>
    html, body { margin: 0; height: 100%; background: #07060c; }
    body { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
    iframe { width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <!-- two players in one page, same room: /dev/coop.html?room=CODE -->
  <iframe id="a"></iframe>
  <iframe id="b"></iframe>
  <script>
    const room = new URLSearchParams(location.search).get('room') || 'T' + Math.random().toString(36).slice(2, 6).toUpperCase();
    document.getElementById('a').src = `/#room=${room}`;
    setTimeout(() => { document.getElementById('b').src = `/#room=${room}`; }, 1500);
  </script>
</body>
</html>
